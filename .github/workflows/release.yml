name: Release

on:
  push:
    branches: [main]
    paths: ["manifest.json"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read the version from the manifest
        id: v
        run: echo "tag=$(jq -r .version manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Verify versions.json covers this release
        env:
          VERSION: ${{ steps.v.outputs.tag }}
        run: |
          if [ ! -f versions.json ]; then
            echo "::error::versions.json is missing — the store cannot map $VERSION to a minAppVersion."
            exit 1
          fi
          if ! jq -e . versions.json >/dev/null 2>&1; then
            echo "::error::versions.json is not valid JSON."
            exit 1
          fi
          MIN=$(jq -r '.minAppVersion' manifest.json)
          MAPPED=$(jq -r --arg v "$VERSION" '.[$v] // empty' versions.json)
          if [ -z "$MAPPED" ]; then
            echo "::error::versions.json has no entry for $VERSION. Add \"$VERSION\": \"$MIN\" to versions.json and push again."
            exit 1
          fi
          if [ "$MAPPED" != "$MIN" ]; then
            echo "::error::versions.json maps $VERSION -> $MAPPED but manifest.minAppVersion is $MIN."
            exit 1
          fi
          echo "versions.json OK: $VERSION -> $MAPPED"

          # Historical rot: warn, don't block — an old unmapped tag is not this
          # release's fault, but it should still be visible.
          MISSING=""
          N=0
          for tag in $(git tag | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$'); do
            N=$((N + 1))
            jq -e --arg v "$tag" 'has($v)' versions.json >/dev/null 2>&1 || MISSING="$MISSING $tag"
          done
          # Report the count: a silently-empty tag list would otherwise be
          # indistinguishable from "all tags mapped", making this check dead code.
          echo "checked $N release tag(s) against versions.json"
          if [ "$N" -eq 0 ]; then
            echo "::warning::no release tags visible — tag coverage was NOT checked (needs fetch-depth: 0)."
          fi
          if [ -n "$MISSING" ]; then
            echo "::warning::released tags missing from versions.json:$MISSING"
          fi

      # The store's build verification compares the release asset with a build
      # from source, so the asset is built here, not taken from the committed
      # main.js (which stays in the repo for reference and BRAT-from-source).
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build main.js from source
        run: |
          npm ci
          npm run build
          test -s main.js

      - name: Tag, release, and upload the assets BRAT needs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — nothing to do."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

          NOTES_FILE="release-notes/${TAG}.md"
          if [ -f "$NOTES_FILE" ]; then
            gh release create "$TAG" --title "$TAG" --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
          # BRAT reads these as individual assets, not from a source archive.
          gh release upload "$TAG" main.js manifest.json styles.css --clobber
